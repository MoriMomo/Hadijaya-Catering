<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Decorative element - food/catering icon -->
  <circle cx="25" cy="30" r="18" fill="url(#logoGradient)" opacity="0.2"/>
  <path d="M25 15 L30 25 L25 35 L20 25 Z" fill="url(#logoGradient)"/>
  <circle cx="25" cy="25" r="3" fill="#fff"/>
  
  <!-- Company name -->
  <text x="50" y="28" font-family="'Playfair Display', serif" font-size="22" font-weight="700" fill="#1e293b">
    Hadijaya
  </text>
  <text x="50" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#64748b" letter-spacing="1.5">
    CATERING
  </text>
  
  <!-- Decorative underline -->
  <rect x="50" y="48" width="80" height="1.5" fill="url(#logoGradient)" opacity="0.6"/>
</svg>
